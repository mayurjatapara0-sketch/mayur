{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Submitted Successfully</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="success-container">

    <div class="success-card">

        <div class="success-icon">✔</div>

        <h1>Complaint Submitted Successfully!</h1>

        <p>Your complaint has been registered successfully.</p>

        <h3>Complaint ID: <span style="color:#007bff;">{{ complaint_id }}</span></h3>

        <a href="/" class="btn">Go to Home</a>

        <a href="/register/" class="btn btn-secondary">Register Another Complaint</a>

    </div>

</div>

</body>
</html>
